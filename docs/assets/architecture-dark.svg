<rect x="594" y="130" width="40" height="24" rx="12" class="chip"/><text x="614" y="146.5" class="c" text-anchor="middle">Tabs</text>
<rect x="476" y="158" width="48" height="24" rx="12" class="chip"/><text x="500" y="174.5" class="c" text-anchor="middle">Toast</text>
<rect x="530" y="158" width="48" height="24" rx="12" class="chip"/><text x="554" y="174.5" class="c" text-anchor="middle">Table</text>
<text x="588" y="175" class="b">+11</text>
<rect x="700" y="70" width="156" height="60" rx="10" class="card"/>
<text x="716" y="95" class="b">Your app</text>
<text x="716" y="115" class="mono">import 'brisa-ui'</text>
<rect x="700" y="150" width="156" height="60" rx="10" class="card"/>
<text x="716" y="175" class="b">Docs site</text>
<text x="716" y="195" class="m">GitHub Pages</text>
<rect x="40" y="320" width="290" height="112" rx="10" class="card"/>
