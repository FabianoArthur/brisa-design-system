@keyframes h0{0%,1.25%{opacity:0}2.50%,11.25%{opacity:.9}18.75%,100%{opacity:0}}
.p0{transform:translate(196px,130px);animation:p0 8s infinite both}
.h0{animation:h0 8s infinite both}

@keyframes p1{0%,11.00%{opacity:0;transform:translate(408px,130px)}12.50%{opacity:1;transform:translate(408px,130px);animation-timing-function:linear}21.25%{opacity:1;transform:translate(460px,130px)}24.38%,100%{opacity:0;transform:translate(460px,130px)}}
@keyframes h1{0%,11.25%{opacity:0}12.50%,21.25%{opacity:.9}28.75%,100%{opacity:0}}
