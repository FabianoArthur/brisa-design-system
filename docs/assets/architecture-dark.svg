@keyframes p5{0%,49.75%{opacity:0;transform:translate(330px,375px)}51.25%{opacity:1;transform:translate(330px,375px);animation-timing-function:linear}58.75%{opacity:1;transform:translate(370px,375px)}61.87%,100%{opacity:0;transform:translate(370px,375px)}}
