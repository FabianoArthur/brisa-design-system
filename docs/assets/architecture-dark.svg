@keyframes p2{0%,21.00%{opacity:0;transform:translate(650px,100px)}22.50%{opacity:1;transform:translate(650px,100px);animation-timing-function:linear}30.00%{opacity:1;transform:translate(700px,100px)}33.13%,100%{opacity:0;transform:translate(700px,100px)}}
