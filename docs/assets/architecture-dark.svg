@keyframes p4{0%,31.00%{opacity:0;transform:translate(555px,190px)}32.50%{opacity:1;transform:translate(555px,190px);animation-timing-function:linear}35.02%{opacity:1;transform:translate(555px,262px);animation-timing-function:linear}47.97%{opacity:1;transform:translate(185px,262px);animation-timing-function:linear}50.00%{opacity:1;transform:translate(185px,320px)}53.13%,100%{opacity:0;transform:translate(185px,320px)}}
@keyframes h4{0%,31.25%{opacity:0}32.50%,50.00%{opacity:.9}57.50%,100%{opacity:0}}
