@keyframes p7{0%,67.25%{opacity:0;transform:translate(778px,320px)}68.75%{opacity:1;transform:translate(778px,320px);animation-timing-function:linear}80.00%{opacity:1;transform:translate(778px,210px)}83.13%,100%{opacity:0;transform:translate(778px,210px)}}
@keyframes h7{0%,67.50%{opacity:0}68.75%,80.00%{opacity:.9}87.50%,100%{opacity:0}}
.p7{transform:translate(778px,320px);animation:p7 8s infinite both}
.h7{animation:h7 8s infinite both}

@media (prefers-reduced-motion:reduce){.pk,.hl{animation:none;display:none}}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#69727f"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="469" rx="16" class="bg"/>
<rect x="24" y="24" width="646" height="222" rx="14" class="zone"/>
