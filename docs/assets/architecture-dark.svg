<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="title desc" lang="en">
<title id="title">How Brisa is built</title>
<desc id="desc">Design tokens in tokens.css define primitives and semantic colours. Themes (light, dark or system) remap the semantic tokens through a data-theme attribute on the html element. Sixteen React and TypeScript components read only semantic tokens and are consumed by your app and by the docs site. The quality gate tests every component with Vitest and Testing Library, runs axe-core accessibility checks and a WCAG contrast contract over the tokens; GitHub Actions CI runs lint, typecheck, tests, build and gitleaks, and on main a Pages workflow deploys the docs site.</desc>
<style>
