.p2{transform:translate(650px,100px);animation:p2 8s infinite both}
.h2{animation:h2 8s infinite both}

@keyframes p3{0%,21.00%{opacity:0;transform:translate(650px,180px)}22.50%{opacity:1;transform:translate(650px,180px);animation-timing-function:linear}30.00%{opacity:1;transform:translate(700px,180px)}33.13%,100%{opacity:0;transform:translate(700px,180px)}}
