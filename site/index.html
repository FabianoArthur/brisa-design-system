<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Brisa is an accessible React + TypeScript design system: themeable tokens, light and dark themes, 16 tested components."
    />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766f'/%3E%3Cpath d='M7 12c4-3 7 3 11 0s5-2 7-1M7 18c4-3 7 3 11 0s5-2 7-1M7 24c4-3 7 3 11 0' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Brisa design system</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var m = localStorage.getItem('brisa-theme');
        if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-theme', m);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
